<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>

  <rect x="-180" y="0" width="120" height="220" fill="#ffffff" opacity="0.025" transform="skewX(-18)">
    <animate attributeName="x" values="-180;1260" dur="10s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 0" dur="1s" fill="freeze"/>

    <text x="120" y="112"
          fill="#f3f3f3"
          font-size="52"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-weight="700">
      osfv
    </text>

    <text x="120" y="145"
          fill="#8f8f8f"
          font-size="17"
          font-family="Inter, Segoe UI, Arial, sans-serif">
      github.com/osfv
    </text>
  </g>

  <line x1="120" y1="164" x2="330" y2="164" stroke="#6e6e6e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="120" cy="164" r="3" fill="#f0f0f0">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
